<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick 7 Against The Spread</title>
<meta name="description" content="Weekly college football & NFL pick'em pool">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pick 7">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div class="centered" id="boot-loading">
    <div class="loading-spinner"></div>
    <div class="hint">Loading Pick 7…</div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        // Registering alone doesn't reliably notice a newer sw.js promptly on
        // every platform -- installed iOS home-screen PWAs in particular can
        // sit on a stale cached app shell for a while otherwise. Force a
        // check on every launch, and once a new service worker actually
        // takes over (skipWaiting + clients.claim in sw.js), reload once so
        // this specific page load picks up the new JS immediately instead of
        // needing a second relaunch to notice anything changed.
        reg.update().catch(() => {});
        let reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      }).catch((e) => console.warn("SW registration failed", e));
    });
  }
</script>
</body>
</html>
